<h2
  mat-dialog-title
  class="m-b-8 d-flex align-items-center"
  style="font-size: 24px; font-weight: 700; color: #1c1e21;"
>
  <mat-icon
    class="m-r-8"
    style="
      background: #e7f3ff;
      color: #1877f2;
      border-radius: 50%;
      padding: 8px;
      width: 40px;
      height: 40px;
      font-size: 24px;
    "
  >
    person_add
  </mat-icon>
  Add Contact
</h2>

<div class="p-x-24 m-b-16" style="color: #65676b; font-size: 14px;">
  Choose a user to start a conversation.
</div>

<mat-dialog-content
  class="mat-typography"
  style="
    max-width: 650px;
    min-width: 520px;
    max-height: 450px;
    overflow-y: auto;
    background: #f7f8fa;
    padding: 12px;
    border-radius: 12px;
  "
>
  <div style="margin-bottom: 12px;">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Search users</mat-label>
      <input matInput [(ngModel)]="searchText" placeholder="Type a name..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div
    *ngIf="filteredUsers.length === 0"
    class="text-center p-24"
    style="color: #65676b;"
  >
    <mat-icon
      style="font-size: 42px; width: 42px; height: 42px; color: #b0b3b8;"
    >
      person_off
    </mat-icon>
    <p class="m-t-12 m-b-0">No users available</p>
  </div>

  <div
    *ngFor="let user of filteredUsers"
    class="d-flex justify-content-between align-items-center m-b-12"
    style="
      background: #ffffff;
      border: 1px solid #e4e6eb;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    "
  >
    <div class="d-flex align-items-center">
      <!-- Avatar -->
<div class="avatar-wrapper">

  <!-- Si image existe -->
  <img
    *ngIf="getContactImage(user); else senderInitialBlock"
    [src]="getContactImage(user)!"
    class="rounded-circle"
    width="40"
    height="40"
    style="object-fit: cover;"
  />

  <!-- Sinon afficher initial -->
  <ng-template #senderInitialBlock>
    <div
      class="rounded-circle d-flex align-items-center justify-content-center contact-image"
      style="
        width: 40px;
        height: 40px;
        background-color: #1976d2;
        color: white;
        font-size: 14px;
        font-weight: bold;
      "
    >
      {{ getContactInitial(user) }}
    </div>
  </ng-template>

</div>

      <div class="m-l-12">
        <div style="font-size: 15px; font-weight: 700; color: #1c1e21;">
          {{ user.username }}
        </div>
        <div
          class="d-flex align-items-center m-t-4"
          style="font-size: 13px; color: #65676b;"
        >
          <mat-icon class="m-r-4" style="font-size: 16px; width: 16px; height: 16px;">
            mail
          </mat-icon>
          {{ user.email }}
        </div>
      </div>
    </div>

           <div class="d-flex gap-1">
        <button
          mat-flat-button
          color="primary"
          (click)="messageUser(user)"
          style="border-radius: 999px; padding: 0 14px; font-weight: 600; height: 38px; font-size: 13px;"
        >
          <mat-icon class="m-r-4" style="font-size: 16px;">chat</mat-icon>
          Message
        </button>

        <button
          mat-stroked-button
          color="primary"
          (click)="addFriend(user)"
          [disabled]="user.requestSent"
          style="border-radius: 999px; padding: 0 14px; font-weight: 600; height: 38px; font-size: 13px;"
        >
          <mat-icon class="m-r-4" style="font-size: 16px;">
            {{ user.requestSent ? 'check' : 'person_add' }}
          </mat-icon>
          {{ user.requestSent ? 'Sent' : 'Add Friend' }}
        </button>
      </div>
  </div>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions
  class="p-24 d-flex justify-content-end"
  style="background: #ffffff;"
>
  <button
    mat-stroked-button
    color="warn"
    (click)="closeDialog()"
    style="border-radius: 999px; padding: 0 18px; height: 40px; font-weight: 600;"
  >
    <mat-icon class="m-r-4" style="font-size: 18px;">close</mat-icon>
    Cancel
  </button>
</mat-dialog-actions>

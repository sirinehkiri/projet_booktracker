<div class="row">
  <!-- Username -->
  <div class="col-sm-6">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <mat-card-title>Personal Details</mat-card-title>

        <mat-card-subtitle class="mat-body-1">
          Change your username here
        </mat-card-subtitle>

        <div class="m-t-24">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">
            Username
          </mat-label>

          <mat-form-field
            appearance="outline"
            class="w-100"
            color="primary"
          >
            <input
              matInput
              type="text"
              [(ngModel)]="username"
              placeholder="Enter username"
            />
          </mat-form-field>

          <button
            mat-flat-button
            color="primary"
            class="m-t-16"
            (click)="updateProfile()"
          >
            Save Username
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Profile Photo -->
  <div class="col-sm-6">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <mat-card-title>Profile Picture</mat-card-title>

        <mat-card-subtitle class="mat-body-1">
          Change your profile picture
        </mat-card-subtitle>

        <div class="text-center m-t-24">
          <img
            [src]="getProfileImage()"
            class="rounded-circle"
            width="120"
            height="120"
            style="object-fit: cover;"
          />

          <div class="m-t-24">
            <input
              type="file"
              hidden
              #fileInput
              (change)="onFileSelected($event)"
              accept="image/*"
            />

            <button
              mat-flat-button
              color="primary"
              class="m-r-8"
              (click)="fileInput.click()"
            >
              Upload
            </button>

            <button
              mat-stroked-button
              color="warn"
              (click)="resetImage()"
            >
              Reset
            </button>
          </div>

          <span class="f-s-14 m-t-16 d-block">
            Allowed JPG, PNG or GIF
          </span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<div class="settings-page">

  <!-- HEADER -->
  <div class="page-header">

    <div>

      <h1>
        Account Settings
      </h1>

      <p>
        Manage your profile information
      </p>

    </div>

  </div>

  <!-- GRID -->
  <div class="settings-grid">

    <!-- PROFILE CARD -->
    <mat-card class="profile-card">

      <div class="profile-cover"></div>

      <div class="profile-content">

        <!-- IMAGE -->
        <div class="image-section">

          <div class="image-wrapper">

            <img
              [src]="getProfileImage()"
              class="profile-image">

            <button
              mat-mini-fab
              color="primary"
              class="edit-image-btn">

              <label for="fileUpload">

                <mat-icon>
                  edit
                </mat-icon>

              </label>

            </button>

          </div>

          <input
            id="fileUpload"
            type="file"
            hidden
            accept="image/*"
            (change)="onFileSelected($event)">

          <h2>

            {{ profileForm.value.username }}

          </h2>

          <p>
            Reader Profile
          </p>

        </div>

        <!-- ACTIONS -->
        <div class="image-actions">

          <button
            mat-flat-button
            color="primary"
            (click)="updateProfile()"
            [disabled]="saving">

            Save Changes

          </button>

          <button
            mat-stroked-button
            color="warn"
            (click)="resetImage()">

            Remove Image

          </button>

        </div>

      </div>

    </mat-card>

    <!-- DETAILS -->
    <mat-card class="details-card">

      <mat-card-content>

        <div class="card-header">

          <div>

            <h2>
              Personal Information
            </h2>

            <p>
              Update your username and profile
            </p>

          </div>

        </div>

        <!-- FORM -->
        <form
          [formGroup]="profileForm"
          class="profile-form">

          <!-- USERNAME -->
          <mat-form-field
            appearance="outline"
            class="w-100">

            <mat-label>
              Username
            </mat-label>

            <input
              matInput
              formControlName="username"
              placeholder="Enter username">

            <mat-icon matSuffix>
              person
            </mat-icon>

            <mat-error
              *ngIf="
                profileForm
                .get('username')
                ?.hasError('required')
              ">

              Username is required

            </mat-error>

            <mat-error
              *ngIf="
                profileForm
                .get('username')
                ?.hasError('minlength')
              ">

              Minimum 3 characters

            </mat-error>

          </mat-form-field>

          <!-- INFO -->
          <div class="info-box">

            <mat-icon>
              info
            </mat-icon>

            <span>

              Supported image formats:
              JPG, PNG, GIF (max 5MB)

            </span>

          </div>

          <!-- BUTTON -->
          <div class="form-actions">

            <button
              mat-flat-button
              color="primary"
              class="save-btn"
              (click)="updateProfile()"
              [disabled]="saving">

              <span *ngIf="!saving">

                Save Profile

              </span>

              <span *ngIf="saving">

                Saving...

              </span>

            </button>

          </div>

        </form>

      </mat-card-content>

    </mat-card>

  </div>

</div>
